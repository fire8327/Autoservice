<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blueRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="spokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="120" height="120" rx="20" fill="#0A0D14"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="60" cy="60" r="54" fill="url(#blueGlow)"/>
  
  <!-- Outer Tire Ring with Grooves -->
  <circle cx="60" cy="60" r="50" stroke="url(#blueRim)" stroke-width="3" fill="#101726"/>
  
  <!-- Outer Alloy Rim Bead -->
  <circle cx="60" cy="60" r="44" stroke="#1E293B" stroke-width="2" fill="#0B111E"/>
  
  <!-- 5 Double-Spokes (Alloy Wheel design from showroom) -->
  <g stroke="url(#spokeGrad)" stroke-width="3.5" stroke-linecap="round">
    <!-- Spoke 1 (top) -->
    <line x1="57" y1="46" x2="57" y2="20"/>
    <line x1="63" y1="46" x2="63" y2="20"/>
    <!-- Spoke 2 (top-right) -->
    <line x1="71" y1="52" x2="94" y2="35"/>
    <line x1="74" y1="57" x2="97" y2="40"/>
    <!-- Spoke 3 (bottom-right) -->
    <line x1="68" y1="69" x2="84" y2="94"/>
    <line x1="63" y1="72" x2="79" y2="97"/>
    <!-- Spoke 4 (bottom-left) -->
    <line x1="52" y1="69" x2="36" y2="94"/>
    <line x1="57" y1="72" x2="41" y2="97"/>
    <!-- Spoke 5 (top-left) -->
    <line x1="49" y1="52" x2="26" y2="35"/>
    <line x1="46" y1="57" x2="23" y2="40"/>
  </g>

  <!-- Brake Disc & Caliper Background -->
  <circle cx="60" cy="60" r="28" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5" fill="#0F172A"/>
  
  <!-- Center Hub with Cobalt Cap -->
  <circle cx="60" cy="60" r="14" fill="url(#blueRim)"/>
  <circle cx="60" cy="60" r="11" fill="#0B111E"/>
  
  <!-- 5 Lug Bolts -->
  <circle cx="60" cy="53" r="1.8" fill="#FFFFFF"/>
  <circle cx="67" cy="58" r="1.8" fill="#FFFFFF"/>
  <circle cx="64" cy="66" r="1.8" fill="#FFFFFF"/>
  <circle cx="56" cy="66" r="1.8" fill="#FFFFFF"/>
  <circle cx="53" cy="58" r="1.8" fill="#FFFFFF"/>

  <!-- Center Emblem Dot -->
  <circle cx="60" cy="60" r="3.5" fill="#38BDF8"/>
</svg>
